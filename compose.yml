services:
  app:
    build: .
    expose:
      - 3000
    environment:
      BASE_URL: http://localhost:${PORT:-8080}
      MONGODB_URI: mongodb://mongodb:27017
    env_file:
      - .env

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    ports:
      - "${PORT:-8080}:8080"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:8080"
      OAUTH2_PROXY_UPSTREAMS: "http://app:3000/"
      OAUTH2_PROXY_REDIRECT_URL: "http://localhost:${PORT:-8080}/oauth2/callback"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: true
      OAUTH2_PROXY_SET_XAUTHREQUEST: true
    env_file:
      - .env

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - broadcaster-mongodb-data:/data/db

volumes:
  broadcaster-mongodb-data:
